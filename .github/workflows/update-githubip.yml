name: Update GitHub IP plugin

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/generate-githubip-plugin.js
      - name: Commit changes
        run: |
          if git diff --quiet -- GitHubIP.plugin; then
            echo "No changes"
            exit 0
          fi
          git config user.name "svipm"
          git config user.email "121270757+svipm@users.noreply.github.com"
          git add GitHubIP.plugin
          git commit -m "Update GitHub IP plugin"
          git push
